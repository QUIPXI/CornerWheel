name: CornerWheel

options:
  minimumXcodeGenVersion: 2.45.3
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "6"
    CORNERWHEEL_SOURCE_REVISION: "unversioned-development"
    CORNERWHEEL_UPDATE_FEED_URL: ""
    CORNERWHEEL_UPDATE_PUBLIC_KEY: "GI7LEWXfjcHWclVAPX2oDYJ5QUefPml+ozHhmpjPdO0="
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      GCC_GENERATE_DEBUGGING_SYMBOLS: YES
      CORNERWHEEL_UPDATE_FEED_URL: "https://updates.cornerwheel.com/appcast.xml"

targets:
  CornerWheel:
    type: application
    platform: macOS
    sources:
      - path: Sources/CornerWheel
        type: group
      - path: Resources/Assets.xcassets
      - path: Resources/ThirdPartyNotices.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cornerwheel.CornerWheel
        PRODUCT_NAME: CornerWheel
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LS_APPLICATION_CATEGORY_TYPE: public.app-category.productivity
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Resources/Debug.entitlements

  CornerWheelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CornerWheelTests
        type: group
    dependencies:
      - target: CornerWheel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cornerwheel.CornerWheelTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CornerWheel.app/Contents/MacOS/CornerWheel"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  CornerWheel:
    build:
      targets:
        CornerWheel: all
        CornerWheelTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CornerWheelTests
    archive:
      config: Release
